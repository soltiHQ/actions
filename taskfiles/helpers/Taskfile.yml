version: '3'

vars:
  git_root:
    sh: git rev-parse --show-toplevel

tasks:
  download/file:
    desc: Download a file.
    silent: true
    internal: true
    requires:
      vars: [ URL, TO ]
    cmds:
      - |
        if [ ! -f "{{.TO}}" ]; then
          echo "Downloading {{.URL}}"
          mkdir -p "$(dirname "{{.TO}}")"
          curl -fsSL -o "{{.TO}}" "{{.URL}}"
        fi
