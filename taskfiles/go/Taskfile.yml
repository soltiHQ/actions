version: '3'

vars:
  git_root:
    sh: git rev-parse --show-toplevel

  # Required: set via includes.vars
  go_version: '{{.go_version}}'

  # Optional: override via includes.vars
  cache_dir: '{{.cache_dir | default ".cache"}}'
  image_patch: '{{.image_patch | default ""}}'

tasks:
  _docker/run:
    internal: true
    silent: true
    requires:
      vars: [ IMAGE, CMD, MOUNT_DIR ]
    dir: "{{.git_root}}"
    cmd: |
      set -euo pipefail

      if ! docker image inspect "{{.IMAGE}}" >/dev/null 2>&1; then
        echo "pulling: {{.IMAGE}}"
        docker pull -q "{{.IMAGE}}" >/dev/null 2>&1 || {
          echo "Failed to pull image: {{.IMAGE}}"
          exit 1
        }
      fi
      docker run --rm --init --pull=never \
        --security-opt no-new-privileges \
        --user $(id -u):$(id -g) \
        --cap-drop=ALL \
        \
        --volume "{{.git_root}}/{{.MOUNT_DIR}}:/workspace:rw" \
        {{if .VOLUMES}}{{range $vol := .VOLUMES}}--volume {{$vol}} {{end}}{{end}} \
        {{if .ENVS}}{{range $env := .ENVS}}--env "{{$env}}" {{end}}{{end}} \
        \
        --workdir /workspace \
        {{.IMAGE}} \
        {{.CMD}}

  _go/tool:
    desc: Internal wrapper for running Go tools.
    internal: true
    silent: true
    requires:
      vars: [ CMD ]
    cmds:
      - cmd: mkdir -p "{{.git_root}}/{{.cache_dir}}"
      - task: _docker/run
        vars:
          IMAGE: "ghcr.io/soltihq/golang-ci:{{.go_version}}{{.image_patch}}"
          CMD: "{{.CMD}}"
          MOUNT_DIR: "."
          VOLUMES:
            - "{{.git_root}}/{{.cache_dir}}:/tmp/{{.cache_dir}}"
          ENVS:
            - "HOME=/tmp"
            - "GOPATH=/tmp/{{.cache_dir}}/gopath"
            - "GOMODCACHE=/tmp/{{.cache_dir}}/mod"
            - "GOCACHE=/tmp/{{.cache_dir}}/build"

  gofumpt:
    desc: Run 'gofumpt'.
    silent: true
    internal: true
    cmds:
      - task: _go/tool
        vars:
          CMD: 'gofumpt -l -w $(git ls-files "*.go")'

  golangci:
    desc: Run 'golangci-lint'.
    silent: true
    internal: true
    vars:
      LINT_ARGS: '{{.LINT_ARGS | default "./..."}}'
    cmds:
      - task: _go/tool
        vars:
          CMD: "golangci-lint run {{.LINT_ARGS}}"

  build:
    desc: Run 'go build' for a specific GOOS / GOARCH.
    silent: true
    internal: true
    requires:
      vars: [ NAME ]
    vars:
      MAIN_PKG: '{{.MAIN_PKG | default "./cmd"}}'
      GOOS: '{{.GOOS | default "linux"}}'
      GOARCH: '{{.GOARCH | default "amd64"}}'
      BUILD_ARGS: '{{.BUILD_ARGS | default "-trimpath -ldflags=\"-s -w\""}}'
    cmds:
      - task: _go/tool
        vars:
          CMD: >-
            sh -c 'mkdir -p bin &&
            CGO_ENABLED=0 GOOS={{.GOOS}} GOARCH={{.GOARCH}}
            go build {{.BUILD_ARGS}}
            -o bin/{{.NAME}}-{{.GOOS}}-{{.GOARCH}} {{.MAIN_PKG}}'

  govulncheck:
    desc: Run 'govulncheck'.
    silent: true
    internal: true
    vars:
      VULN_ARGS: '{{.VULN_ARGS | default "./..."}}'
    cmds:
      - task: _go/tool
        vars:
          CMD: "govulncheck {{.VULN_ARGS}}"

  test:
    desc: Run 'go test'.
    silent: true
    internal: true
    vars:
      TEST_ARGS: '{{.TEST_ARGS | default "./..."}}'
    cmds:
      - task: _go/tool
        vars:
          CMD: "go test {{.TEST_ARGS}}"

  proto/gen:
    desc: Run 'buf generate'.
    silent: true
    internal: true
    vars:
      BUF_ARGS: '{{.BUF_ARGS | default ""}}'
    cmds:
      - task: _go/tool
        vars:
          CMD: "buf generate {{.BUF_ARGS}}"

  templ/gen:
    desc: Run 'templ generate'.
    silent: true
    internal: true
    vars:
      TEMPL_ARGS: '{{.TEMPL_ARGS | default ""}}'
    cmds:
      - task: _go/tool
        vars:
          CMD: "templ generate {{.TEMPL_ARGS}}"

  tailwindcss/gen:
    desc: Run 'tailwindcss' compile.
    silent: true
    internal: true
    requires:
      vars: [ INPUT, OUTPUT ]
    vars:
      CONFIG:         '{{.CONFIG | default "tailwind.config.cjs"}}'
      TAILWIND_ARGS:  '{{.TAILWIND_ARGS | default "--minify"}}'
    cmds:
      - task: _go/tool
        vars:
          CMD: "tailwindcss -c {{.CONFIG}} -i {{.INPUT}} -o {{.OUTPUT}} {{.TAILWIND_ARGS}}"

  tidy:
    desc: Run 'go mod tidy'.
    silent: true
    cmds:
      - task: _go/tool
        vars:
          CMD: "go mod tidy"

  vendor:
    desc: Run 'go mod vendor'.
    silent: true
    cmds:
      - task: _go/tool
        vars:
          CMD: "go mod vendor"