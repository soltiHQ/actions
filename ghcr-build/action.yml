name: GHCR Build
description: Build and push a multi-platform image to GHCR.

inputs:
  docker_username:
    description: 'Docker auth username'
    required: true
  docker_password:
    description: 'Docker auth password'
    required: true
  image:
    description: 'Image path inside the registry'
    required: true
  tag:
    description: 'Mutable contract tag'
    required: true
  context:
    description: 'Docker build context'
    required: true
  build_args:
    description: 'Newline-separated Docker build arguments'
    required: false
    default: ''
  platforms:
    description: 'Comma-separated target platforms'
    required: false
    default: 'linux/amd64,linux/arm64'

runs:
  using: "composite"
  steps:
    - name: Checkout repo
      uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ inputs.docker_username }}
        password: ${{ inputs.docker_password }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v4

    - name: Prepare image metadata
      id: metadata
      shell: bash
      run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

    - name: Build and push image
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.context }}/Dockerfile
        platforms: ${{ inputs.platforms }}
        push: true
        tags: |
          ghcr.io/soltihq/${{ inputs.image }}:${{ inputs.tag }}
          ghcr.io/soltihq/${{ inputs.image }}:${{ inputs.tag }}-sha-${{ github.sha }}
        build-args: ${{ inputs.build_args }}
        labels: |
          org.opencontainers.image.authors=SoltiHQ
          org.opencontainers.image.vendor=Solti
          org.opencontainers.image.created=${{ steps.metadata.outputs.created }}
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.title=${{ inputs.image }}
          org.opencontainers.image.version=${{ inputs.tag }}
