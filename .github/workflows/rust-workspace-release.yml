name: Rust workspace release

on:
  workflow_call:
    inputs:
      crates-file:
        description: File containing publishable crate names in dependency order.
        type: string
        required: false
        default: .github/crates.txt
      default-branch:
        description: Branch that must contain the tagged commit.
        type: string
        required: false
        default: main
      prepare-task:
        description: Optional Taskfile command executed before publishing.
        type: string
        required: false
        default: ""
      allow-dirty:
        description: Allow generated files created by the preparation task.
        type: boolean
        required: false
        default: false
    secrets:
      crates-io-token:
        description: crates.io registry token.
        required: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      crates: ${{ steps.workspace.outputs.crates }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify tag and workspace
        id: workspace
        shell: bash
        env:
          CRATES_FILE: ${{ inputs.crates-file }}
          DEFAULT_BRANCH: ${{ inputs.default-branch }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git fetch origin "$DEFAULT_BRANCH" --depth=1
          tag_commit=$(git rev-list -n 1 "$REF")
          git rev-parse --verify "origin/$DEFAULT_BRANCH" >/dev/null
          if ! git merge-base --is-ancestor "$tag_commit" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tag commit is not an ancestor of origin/$DEFAULT_BRANCH"
            exit 1
          fi

          if [ ! -f "$CRATES_FILE" ]; then
            echo "::error file=$CRATES_FILE::crate list does not exist"
            exit 1
          fi

          mapfile -t crates < <(grep -vE '^\s*(#|$)' "$CRATES_FILE")
          if [ "${#crates[@]}" -eq 0 ]; then
            echo "::error file=$CRATES_FILE::crate list is empty"
            exit 1
          fi

          metadata=$(cargo metadata --locked --no-deps --format-version 1)
          tag_version=${REF_NAME#v}
          crates_json=$(printf '%s\n' "${crates[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')

          listed=$(printf '%s\n' "${crates[@]}" | sort)
          publishable=$(jq -r '
            .workspace_members[] as $id
            | .packages[]
            | select(.id == $id and (.publish == null or (.publish | length) > 0))
            | .name
          ' <<< "$metadata" | sort)
          if [ "$listed" != "$publishable" ]; then
            echo "::error file=$CRATES_FILE::crate list must contain every publishable workspace package exactly once"
            diff -u <(printf '%s\n' "$publishable") <(printf '%s\n' "$listed") || true
            exit 1
          fi

          bad_versions=$(jq -r --argjson crates "$crates_json" --arg version "$tag_version" '
            .packages[]
            | select(.name as $name | $crates | index($name))
            | select(.version != $version)
            | "\(.name)=\(.version)"
          ' <<< "$metadata")
          if [ -n "$bad_versions" ]; then
            echo "::error::workspace package versions must equal tag version $tag_version: $bad_versions"
            exit 1
          fi

          bad_dependencies=$(jq -r --argjson crates "$crates_json" --arg version "$tag_version" '
            .packages[] as $package
            | select(($crates | index($package.name)) != null)
            | $package.dependencies[] as $dependency
            | select($dependency.path != null and (($crates | index($dependency.name)) != null))
            | if (($crates | index($dependency.name)) >= ($crates | index($package.name))) then
                "\($dependency.name) must appear before \($package.name)"
              elif ($dependency.req != ("^" + $version) and $dependency.req != ("=" + $version)) then
                "\($package.name) depends on \($dependency.name) with \($dependency.req), expected \($version)"
              else
                empty
              end
          ' <<< "$metadata")
          if [ -n "$bad_dependencies" ]; then
            echo "::error file=$CRATES_FILE::$bad_dependencies"
            exit 1
          fi

          {
            echo "crates<<EOF"
            printf '%s\n' "${crates[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    steps:
      - uses: actions/checkout@v6

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - name: Prepare generated sources
        if: inputs.prepare-task != ''
        uses: soltiHQ/actions/taskfile@v1
        with:
          command: ${{ inputs.prepare-task }}

      - name: Publish workspace crates
        uses: soltiHQ/actions/cargo-publish@v1
        with:
          crates: ${{ needs.verify.outputs.crates }}
          token: ${{ secrets.crates-io-token }}
          allow-dirty: ${{ inputs.allow-dirty }}

  gh-release:
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Build crate and documentation links
        id: body
        shell: bash
        env:
          CRATES: ${{ needs.verify.outputs.crates }}
        run: |
          set -euo pipefail
          {
            echo "body<<EOF"
            echo "### Crates published"
            for crate in $CRATES; do
              echo "- https://crates.io/crates/$crate"
            done
            echo
            echo "### Docs"
            for crate in $CRATES; do
              echo "- https://docs.rs/$crate"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: ${{ steps.body.outputs.body }}
