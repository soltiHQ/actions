name: Rust CI

on:
  workflow_call:
    inputs:
      preflight-required:
        description: Fail the gate when the publish dry-run fails. Set false for workspaces (cross-crate version bumps legitimately fail the dry-run until dependencies are published).
        type: boolean
        required: false
        default: true

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Run fmt
        uses: soltiHQ/actions/taskfile@v1
        with: { command: ci/fmt }

  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Run check
        uses: soltiHQ/actions/taskfile@v1
        with: { command: ci/check }

  unittest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: soltiHQ/actions/cargo-cache@v1
        with: { scope: unittest }
      - name: Run unit tests
        uses: soltiHQ/actions/taskfile@v1
        with: { command: ci/test-unit }

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: soltiHQ/actions/cargo-cache@v1
        with: { scope: integration }
      - name: Run integration tests
        uses: soltiHQ/actions/taskfile@v1
        with: { command: ci/test-integration }

  clippy-features:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: set
        shell: bash
        run: |
          feats=$(awk '
            /^\[features\]/ { f = 1; next }
            /^\[/           { f = 0 }
            f && /=/        { if ($1 != "default") print $1 }
          ' Cargo.toml)
          matrix=$(printf 'none\n%s\nall\n' "$feats" | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  clippy:
    needs: clippy-features
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.clippy-features.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: soltiHQ/actions/cargo-cache@v1
        with:
          scope: clippy-${{ matrix.feature }}
      - name: Run clippy
        uses: soltiHQ/actions/taskfile@v1
        with:
          command: ci/clippy FEATURE=${{ matrix.feature }}

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Run audit
        uses: soltiHQ/actions/taskfile@v1
        with: { command: ci/audit }

  docs:
    needs: [audit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Run docs gen
        uses: soltiHQ/actions/taskfile@v1
        with: { command: ci/docs }

  examples:
    needs: [audit]
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: set
        shell: bash
        run: |
          entries=$(find examples -mindepth 1 -maxdepth 1 -type f -name '*.rs' -exec basename {} .rs \; 2>/dev/null || true)
          matrix=$(printf '%s\n' "$entries" | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  examples-build:
    needs: examples
    if: needs.examples.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.examples.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - name: Build example
        uses: soltiHQ/actions/taskfile@v1
        with:
          command: ci/build CRATE=${{ matrix.example }}

  preflight:
    needs: [audit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Run publish dry-run
        uses: soltiHQ/actions/taskfile@v1
        with: { command: ci/publish-dry-run }

  gate:
    if: always()
    needs: [fmt, check, unittest, integration, clippy, audit, docs, examples, examples-build, preflight]
    runs-on: ubuntu-24.04
    steps:
      - name: Gate
        uses: soltiHQ/actions/gate@v1
        with:
          results: ${{ toJSON(needs) }}
          allow: ${{ !inputs.preflight-required && 'preflight' || '' }}
          allow-skipped: examples-build
